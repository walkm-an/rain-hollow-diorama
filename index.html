<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rain Hollow · pixel Halloween diorama</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060c;
        cursor: none;
      }
      #screen {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 10px;
        margin: 0;
        padding: 6px 8px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        color: #cfe3ff;
        background: rgba(5, 6, 12, 0.7);
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <pre id="hud" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
